name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        id: checkout
        uses: actions/checkout@v4

      - name: Maximize Build Space
        id: space
        run: |
          echo "=== TAHAP MAXIMIZE BUILD SPACE ===" > ~/space_output.log
          {
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
            sudo swapoff -a && sudo rm -f /swapfile
            sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile
            sudo mkswap /swapfile && sudo swapon /swapfile
          } >> ~/space_output.log 2>&1

      - name: Install Dependencies
        id: deps
        run: |
          echo "=== TAHAP INSTALL DEPENDENCIES ===" > ~/deps_output.log
          {
            sudo apt-get update
            sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          } >> ~/deps_output.log 2>&1

      - name: Install Google Repo Tool
        id: repo_tool
        run: |
          echo "=== TAHAP INSTALL REPO TOOL ===" > ~/repo_output.log
          {
            mkdir -p ~/bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
            sudo cp ~/bin/repo /usr/local/bin/repo
          } >> ~/repo_output.log 2>&1

      - name: Sync OrangeFox Source
        id: sync
        run: |
          echo "=== 1. TAHAP SYNC SOURCE ORANGEFOX ===" > ~/sync_output.log
          {
            mkdir -p ~/orangefox_sync && cd ~/orangefox_sync
            git config --global user.name "M0z41D"
            git config --global user.email "m0z41d@example.com"
            git clone https://gitlab.com/OrangeFox/sync.git .
            
            touch ~/orangefox_sync/patch-vendor-twrp-fox_12.1.diff 2>/dev/null || true
            
            ./orangefox_sync.sh --branch 12.1 --path ~/orangefox

            if [ ! -d "$HOME/orangefox/vendor/fox" ]; then
              echo "Cloning vendor/fox repository..."
              git clone https://gitlab.com/OrangeFox/vendor/fox.git -b fox_12.1 ~/orangefox/vendor/fox --depth=1 || true
            fi
          } >> ~/sync_output.log 2>&1

      - name: Inject Device Tree & Patch Configs
        id: inject
        run: |
          echo "=== 2. TAHAP INJECT DEVICE TREE & PATCH CONFIG ===" > ~/inject_output.log
          {
            DT_DIR=~/orangefox/device/infinix/X6855
            mkdir -p "$DT_DIR"
            
            cp -r . "$DT_DIR/"
            echo "Device tree berhasil disalin ke $DT_DIR"

            find "$DT_DIR" -type f -name "*.mk" -exec sed -i '/FOX_TARGET_DEVICES/d' {} +
            find "$DT_DIR" -type f -name "*.mk" -exec sed -i '/OF_TARGET_DEVICES/d' {} +
            find "$DT_DIR" -type f -name "*.mk" -exec sed -i 's|^include vendor/fox/|-include vendor/fox/|g' {} +

            BOARD_CONFIG="$DT_DIR/BoardConfig.mk"
            if [ ! -f "$BOARD_CONFIG" ]; then
              touch "$BOARD_CONFIG"
            fi
            
            grep -q "BOARD_KERNEL_IMAGE_NAME" "$BOARD_CONFIG" || echo "BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb" >> "$BOARD_CONFIG"
            grep -q "TW_THEME" "$BOARD_CONFIG" || echo "TW_THEME := portrait_hdpi" >> "$BOARD_CONFIG"
            grep -q "TARGET_SUPPORTS_64_BIT_APPS" "$BOARD_CONFIG" || echo "TARGET_SUPPORTS_64_BIT_APPS := false" >> "$BOARD_CONFIG"
            grep -q "TARGET_SCREEN_WIDTH" "$BOARD_CONFIG" || echo "TARGET_SCREEN_WIDTH := 720" >> "$BOARD_CONFIG"
            grep -q "TARGET_SCREEN_HEIGHT" "$BOARD_CONFIG" || echo "TARGET_SCREEN_HEIGHT := 1600" >> "$BOARD_CONFIG"

            rm -f "$DT_DIR/vendorsetup.sh"

            if [ ! -f "$DT_DIR/AndroidProducts.mk" ]; then
              echo 'PRODUCT_MAKEFILES := $(LOCAL_DIR)/fox_X6855.mk $(LOCAL_DIR)/omni_X6855.mk' > "$DT_DIR/AndroidProducts.mk"
              echo 'COMMON_LUNCH_CHOICES := fox_X6855-eng fox_X6855-userdebug omni_X6855-eng omni_X6855-userdebug' >> "$DT_DIR/AndroidProducts.mk"
            fi

            if [ ! -f "$DT_DIR/fox_X6855.mk" ]; then
              echo '$(call inherit-product,$(SRC_TARGET_DIR)/product/full_base_telephony.mk)' > "$DT_DIR/fox_X6855.mk"
              echo 'PRODUCT_NAME := fox_X6855' >> "$DT_DIR/fox_X6855.mk"
              echo 'PRODUCT_DEVICE := X6855' >> "$DT_DIR/fox_X6855.mk"
              echo 'PRODUCT_MANUFACTURER := infinix' >> "$DT_DIR/fox_X6855.mk"
            fi

            if [ ! -f "$DT_DIR/omni_X6855.mk" ]; then
              echo '$(call inherit-product,$(SRC_TARGET_DIR)/product/full_base_telephony.mk)' > "$DT_DIR/omni_X6855.mk"
              echo 'PRODUCT_NAME := omni_X6855' >> "$DT_DIR/omni_X6855.mk"
              echo 'PRODUCT_DEVICE := X6855' >> "$DT_DIR/omni_X6855.mk"
              echo 'PRODUCT_MANUFACTURER := infinix' >> "$DT_DIR/omni_X6855.mk"
            fi

            echo "Struktur direktori device tree terinjeksi:"
            ls -la "$DT_DIR"
            echo "Konfigurasi device tree berhasil dipatch sepenuhnya."
          } >> ~/inject_output.log 2>&1

      - name: Compile Recovery
        id: compile
        run: |
          set +e
          echo "=== 3. TAHAP KOMPILASI RECOVERY ===" > ~/compile_output.log
          {
            cd ~/orangefox || { echo "GAGAL: Direktori ~/orangefox tidak ditemukan!"; exit 1; }
            
            find ~/orangefox/bootable/recovery -type f -name "*.mk" -exec sed -i '/FOX_TARGET_DEVICES/d' {} + 2>/dev/null || true

            OF_MK=~/orangefox/bootable/recovery/orangefox.mk
            if [ -f "$OF_MK" ]; then
              echo 'import sys' > /tmp/patch_of.py
              echo 'p = sys.argv[1]' >> /tmp/patch_of.py
              echo 'lines = open(p).readlines()' >> /tmp/patch_of.py
              echo 'open(p, "w").writelines([x for i, x in enumerate(lines) if not (i >= 309 and "endif" in x)])' >> /tmp/patch_of.py
              python3 /tmp/patch_of.py "$OF_MK" 2>/dev/null || true
              echo "Patch extraneous endif pada $OF_MK telah diterapkan."
            fi

            export ALLOW_MISSING_DEPENDENCIES=true
            export FOX_BUILD_DEVICE="X6855"
            export LC_ALL="C"
            
            echo "-> Menjalankan envsetup.sh..."
            source build/envsetup.sh
            echo "Status exit envsetup: $?"

            echo "-> Menjalankan perintah lunch..."
            lunch fox_X6855-eng || lunch fox_X6855-userdebug || lunch omni_X6855-eng || lunch omni_X6855-userdebug
            echo "Status exit lunch: $?"

            echo "-> Memulai proses kompilasi mka..."
            mka vendorbootimage -j$(nproc) || mka recoveryimage -j$(nproc) || mka bootimage -j$(nproc)
            echo "Status exit mka: $?"
            
            echo "-> Memeriksa hasil file output build..."
            OUT_DIR="/home/runner/orangefox/out/target/product/X6855"
            
            if [ -f "$OUT_DIR/recovery.img" ] || [ -f "$OUT_DIR/vendor_boot.img" ] || [ -f "$OUT_DIR/boot.img" ] || ls $OUT_DIR/OrangeFox-*.zip >/dev/null 2>&1; then
              echo "SUKSES: File image OrangeFox ditemukan!"
              exit 0
            else
              echo "GAGAL TOTAL: File recovery.img / vendor_boot.img / .zip tidak ditemukan!"
              exit 1
            fi
          } >> ~/compile_output.log 2>&1

      - name: Generate Detailed Full Report
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SPACE_OUTCOME: ${{ steps.space.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          REPO_OUTCOME: ${{ steps.repo_tool.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          INJECT_OUTCOME: ${{ steps.inject.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          REPORT_FILE=~/report_${RUN_NUM}.txt
          BUILD_TIME="$(date)"
          
          get_icon() {
            if [ "$1" = "success" ]; then
              echo "✅ Sukses"
            elif [ "$1" = "skipped" ]; then
              echo "⚠️ Dilewati"
            else
              echo "❌ Gagal"
            fi
          }

          ICON_CHECKOUT=$(get_icon "$CHECKOUT_OUTCOME")
          ICON_SPACE=$(get_icon "$SPACE_OUTCOME")
          ICON_DEPS=$(get_icon "$DEPS_OUTCOME")
          ICON_REPO=$(get_icon "$REPO_OUTCOME")
          ICON_SYNC=$(get_icon "$SYNC_OUTCOME")
          ICON_INJECT=$(get_icon "$INJECT_OUTCOME")
          ICON_COMPILE=$(get_icon "$COMPILE_OUTCOME")

          {
            echo "================================================================================"
            echo "                        ORANGEFOX BUILD FULL DETAILED REPORT"
            echo "================================================================================"
            echo "Waktu Eksekusi : $BUILD_TIME"
            echo "Target Device  : Infinix X6855"
            echo "Build Number   : #$RUN_NUM"
            echo "Runner OS      : $(lsb_release -ds 2>/dev/null || echo "Ubuntu")"
            echo "CPU Cores      : $(nproc) Cores"
            echo "--------------------------------------------------------------------------------"
            echo ""
            echo "[ I. RINGKASAN STATUS TAHAPAN WORKFLOW ]"
            echo "- Checkout Code       : $ICON_CHECKOUT"
            echo "- Maximize Build Space: $ICON_SPACE"
            echo "- Install Dependencies: $ICON_DEPS"
            echo "- Install Repo Tool   : $ICON_REPO"
            echo "- Sync Source         : $ICON_SYNC"
            echo "- Inject Device Tree  : $ICON_INJECT"
            echo "- Compile Recovery    : $ICON_COMPILE"
            echo ""
            echo "--------------------------------------------------------------------------------"
            echo "[ II. INFORMASI SUMBER DAYA SISTEM (DISK & RAM) ]"
            echo "--- Kapasitas Disk (DF) ---"
            df -h
            echo ""
            echo "--- Status Memori & Swap (FREE) ---"
            free -h
            echo ""
            echo "--------------------------------------------------------------------------------"
            echo "[ III. RANGKUMAN TANGKAPAN ERROR & PERINGATAN ]"
          } > "$REPORT_FILE"

          ERRORS_FOUND=$(grep -iE "error:|missing|FAILED|fatal:|ninja: build stopped|obsolete|\*\*\*" ~/compile_output.log ~/inject_output.log ~/sync_output.log ~/deps_output.log 2>/dev/null || true)
          if [ -n "$ERRORS_FOUND" ]; then
            echo "$ERRORS_FOUND" >> "$REPORT_FILE"
          else
            echo "Tidak ditemukan pesan error spesifik dalam log." >> "$REPORT_FILE"
          fi

          {
            echo ""
            echo "========================================"
            echo "1. LOG MAXIMIZE SPACE"
            echo "========================================"
            cat ~/space_output.log 2>/dev/null || echo "Log space kosong."
            
            echo ""
            echo "========================================"
            echo "2. LOG INSTALL DEPENDENCIES"
            echo "========================================"
            cat ~/deps_output.log 2>/dev/null || echo "Log deps kosong."
            
            echo ""
            echo "========================================"
            echo "3. LOG INSTALL REPO TOOL"
            echo "========================================"
            cat ~/repo_output.log 2>/dev/null || echo "Log repo tool kosong."
            
            echo ""
            echo "========================================"
            echo "4. LOG SYNC SOURCE"
            echo "========================================"
            cat ~/sync_output.log 2>/dev/null || echo "Log sync kosong."
            
            echo ""
            echo "========================================"
            echo "5. LOG INJECT DEVICE TREE"
            echo "========================================"
            cat ~/inject_output.log 2>/dev/null || echo "Log inject kosong."
            
            echo ""
            echo "========================================"
            echo "6. LOG KOMPILASI (COMPILE BUILD)"
            echo "========================================"
            cat ~/compile_output.log 2>/dev/null || echo "Log compile kosong."
            
            echo ""
            echo "================================================================================"
            echo "AKHIR DARI LAPORAN UTUH AUTOMATED REPORT"
          } >> "$REPORT_FILE"

          BT=$(printf '\x60\x60\x60')
          {
            echo "# 🦊 OrangeFox Recovery Build Full Report (#$RUN_NUM)"
            echo ""
            echo "### 📊 Ringkasan Status Tahapan"
            echo "| Tahapan Build | Status | Detail |"
            echo "| :--- | :---: | :--- |"
            echo "| 🛠️ Checkout Code | $ICON_CHECKOUT | Ambil kode repositori |"
            echo "| 🧹 Maximize Build Space | $ICON_SPACE | Bersihkan disk runner & swap |"
            echo "| 📦 Install Dependencies | $ICON_DEPS | Pasang paket kompilasi |"
            echo "| 🛠️ Install Repo Tool | $ICON_REPO | Unduh Google Repo CLI |"
            echo "| 🔄 Sync Source | $ICON_SYNC | Pull manifes OrangeFox 12.1 |"
            echo "| 📁 Inject Device Tree | $ICON_INJECT | Konfigurasi Infinix X6855 |"
            echo "| ⚙️ Compile Recovery | $ICON_COMPILE | Kompilasi image recovery |"
            echo ""
            echo "---"
            echo ""
            echo "### 💾 Sumber Daya Sistem"
            echo "${BT}text"
            df -h | head -n 6
            echo "${BT}"
            echo "${BT}text"
            free -h
            echo "${BT}"
            echo ""
            echo "---"
            echo ""
            echo "### 🚨 Analisis Error Terdeteksi"
            echo "${BT}text"
            grep -iE "error:|missing|FAILED|fatal:|ninja: build stopped|obsolete|\*\*\*" ~/compile_output.log ~/inject_output.log ~/sync_output.log ~/deps_output.log 2>/dev/null | tail -n 30 || echo "Tidak ada error spesifik terdeteksi."
            echo "${BT}"
            echo ""
            echo "---"
            echo ""
            echo "### 📜 Log Eksekusi Lengkap (Klik Dropdown)"
            echo ""
            echo "<details><summary>🔍 1. Log Sync Source</summary>"
            echo ""
            echo "${BT}text"
            cat ~/sync_output.log 2>/dev/null || echo "Log sync kosong."
            echo "${BT}"
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>🔍 2. Log Inject Device Tree</summary>"
            echo ""
            echo "${BT}text"
            cat ~/inject_output.log 2>/dev/null || echo "Log inject kosong."
            echo "${BT}"
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>🔍 3. Log Compile Recovery</summary>"
            echo ""
            echo "${BT}text"
            cat ~/compile_output.log 2>/dev/null || echo "Log compile kosong."
            echo "${BT}"
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>🔍 4. Log Install Dependencies & Setup</summary>"
            echo ""
            echo "${BT}text"
            cat ~/deps_output.log 2>/dev/null || echo "Log deps kosong."
            echo "${BT}"
            echo ""
            echo "</details>"
          } > summary.md

          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Report-${{ github.run_number }}
          path: |
            /home/runner/report_${{ github.run_number }}.txt
            /home/runner/orangefox/out/target/product/X6855/vendor_boot.img
            /home/runner/orangefox/out/target/product/X6855/recovery.img
            /home/runner/orangefox/out/target/product/X6855/boot.img
            /home/runner/orangefox/out/target/product/X6855/OrangeFox-*.zip
          if-no-files-found: ignore
