name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Cleanup & Setup Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bisons build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo

      - name: Initialize OrangeFox Manifest
        run: |
          mkdir -p ~/orangefox && cd ~/orangefox
          git config --global user.name "M0z41D"
          git config --global user.email "m0z41d@example.com"
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --depth=1
          repo sync -c --no-clone-bundle --no-tags -j$(nproc)

      - name: Inject Device Tree
        run: |
          mkdir -p ~/orangefox/device/infinix/X6855
          cp -r $GITHUB_WORKSPACE/* ~/orangefox/device/infinix/X6855/

      - name: Compile OrangeFox
        run: |
          cd ~/orangefox
          source build/envsetup.sh
          lunch fox_X6855-eng
          mka vendor_bootimage -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: OrangeFox-Infinix-X6855
          path: |
            /home/runner/orangefox/out/target/product/X6855/vendor_boot.img
            /home/runner/orangefox/out/target/product/X6855/OrangeFox-*.zip