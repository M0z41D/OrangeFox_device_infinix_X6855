name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo cp ~/bin/repo /usr/local/bin/repo

      - name: Initialize & Sync OrangeFox Source
        run: |
          set -e

          # 1. Isolasi Total Lingkungan Git Runner
          rm -rf "$GITHUB_WORKSPACE/.git"
          sudo rm -f /etc/gitconfig ~/.gitconfig
          rm -rf ~/.config/git ~/.netrc
          
          # Hapus variabel lingkungan penyusup dari GitHub Actions
          for var in $(env | grep -oP '^GIT_\w+'); do
            unset "$var"
          done

          # 2. Identitas Git Lokal
          git config --global user.name "M0z41D"
          git config --global user.email "m0z41d@example.com"
          git config --global color.ui false

          # 3. Buat Folder Kerja
          mkdir -p ~/orangefox
          cd ~/orangefox

          # 4. Inisialisasi Repo dari Mirror GitHub Utama
          echo "==> Menginisialisasi Manifest OrangeFox..."
          repo init -u https://github.com/OrangeFox-Manifest/manifest.git -b fox_12.1 --depth=1 || \
          repo init -u https://github.com/OFRP/Manifest.git -b fox_12.1 --depth=1 || \
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --depth=1

          # 5. Patch default.xml: Alihkan fetch GitLab ke Mirror GitHub jika terkena WAF
          if [ -f .repo/manifests/default.xml ]; then
            echo "==> Memeriksa dan mengoptimalkan lokasi remote manifest..."
            sed -i 's|fetch="https://gitlab.com/OrangeFox"|fetch="https://github.com/OrangeFox-Manifest"|g' .repo/manifests/default.xml || true
          fi

          # 6. Eksekusi Sync dengan Paralel Rendah & Retry Handler
          echo "==> Memulai Repo Sync..."
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j2 || \
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j1

      - name: Inject Device Tree
        run: |
          mkdir -p ~/orangefox/device/infinix/X6855
          cp -r $GITHUB_WORKSPACE/* ~/orangefox/device/infinix/X6855/

      - name: Compile OrangeFox
        run: |
          cd ~/orangefox
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="X6855"
          export LC_ALL="C"
          source build/envsetup.sh
          lunch fox_X6855-eng || lunch fox_X6855-userdebug
          mka vendorbootimage -j$(nproc) || mka recoveryimage -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Infinix-X6855
          path: |
            /home/runner/orangefox/out/target/product/X6855/vendor_boot.img
            /home/runner/orangefox/out/target/product/X6855/recovery.img
            /home/runner/orangefox/out/target/product/X6855/OrangeFox-*.zip
            
