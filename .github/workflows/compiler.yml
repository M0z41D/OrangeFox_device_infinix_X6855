name: Build OrangeFox Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a && sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo cp ~/bin/repo /usr/local/bin/repo

      - name: Sync OrangeFox Source
        id: sync
        continue-on-error: true
        run: |
          mkdir -p ~/orangefox_sync && cd ~/orangefox_sync
          git config --global user.name "M0z41D"
          git config --global user.email "m0z41d@example.com"
          git clone https://gitlab.com/OrangeFox/sync.git .
          ./orangefox_sync.sh --branch 12.1 --path ~/orangefox

      - name: Inject Device Tree
        id: inject
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p ~/orangefox/device/infinix/X6855
          cp -r $GITHUB_WORKSPACE/* ~/orangefox/device/infinix/X6855/

      - name: Compile OrangeFox
        id: compile
        if: steps.inject.outcome == 'success'
        continue-on-error: true
        run: |
          cd ~/orangefox
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="X6855"
          export LC_ALL="C"
          source build/envsetup.sh
          lunch fox_X6855-eng || lunch fox_X6855-userdebug
          mka vendorbootimage -j$(nproc) \vert{}\vert{} mka recoveryimage -j$(nproc)

      - name: Generate Report File
        if: always()
        run: |
          echo "=== ORANGEFOX BUILD REPORT ===" > ~/report.txt
          echo "Waktu Eksekusi: $(date)" >> ~/report.txt
          echo "----------------------------------------" >> ~/report.txt
          echo "1. Sync Status: ${{ steps.sync.outcome }}" >> ~/report.txt
          echo "2. Inject Device Tree Status: ${{ steps.inject.outcome }}" >> ~/report.txt
          echo "3. Compile Status: ${{ steps.compile.outcome }}" >> ~/report.txt
          echo "----------------------------------------" >> ~/report.txt
          
          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            echo "STATUS: TERJADI KESALAHAN / BUILD GAGAL!" >> ~/report.txt
            echo "Silakan periksa log di atas atau isi file report ini." >> ~/report.txt
          else
            echo "STATUS: BUILD BERHASIL SEPENUHNYA!" >> ~/report.txt
          fi

      - name: Prepare Release Files
        if: always()
        run: |
          mkdir -p ~/release_files
          cp /home/runner/report.txt ~/release_files/ || true
          [ -f /home/runner/orangefox/out/target/product/X6855/vendor_boot.img ] && cp /home/runner/orangefox/out/target/product/X6855/vendor_boot.img ~/release_files/ || true
          [ -f /home/runner/orangefox/out/target/product/X6855/recovery.img ] && cp /home/runner/orangefox/out/target/product/X6855/recovery.img ~/release_files/ || true
          cp /home/runner/orangefox/out/target/product/X6855/OrangeFox-*.zip ~/release_files/ 2>/dev/null || true

      - name: Upload to GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orangefox-build-${{ github.run_number }}
          name: "OrangeFox Build Report & Files #${{ github.run_number }}"
          body: |
            Laporan otomatis untuk build Infinix X6855.
            - Status Sync: ${{ steps.sync.outcome }}
            - Status Inject: ${{ steps.inject.outcome }}
            - Status Compile: ${{ steps.compile.outcome }}
            
            Silakan unduh file `report.txt` di bawah untuk melihat rincian status atau error-nya.
          files: ~/release_files/*
