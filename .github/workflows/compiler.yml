name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        id: checkout
        uses: actions/checkout@v4

      - name: Maximize Build Space
        id: space
        run: |
          echo "=== TAHAP MAXIMIZE BUILD SPACE ===" > ~/space_output.log
          {
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
            sudo swapoff -a && sudo rm -f /swapfile
            sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile
            sudo mkswap /swapfile && sudo swapon /swapfile
          } >> ~/space_output.log 2>&1

      - name: Install Dependencies
        id: deps
        run: |
          echo "=== TAHAP INSTALL DEPENDENCIES ===" > ~/deps_output.log
          {
            sudo apt-get update
            sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          } >> ~/deps_output.log 2>&1

      - name: Install Google Repo Tool
        id: repo_tool
        run: |
          echo "=== TAHAP INSTALL REPO TOOL ===" > ~/repo_output.log
          {
            mkdir -p ~/bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
            sudo cp ~/bin/repo /usr/local/bin/repo
          } >> ~/repo_output.log 2>&1

      - name: Sync OrangeFox Source
        id: sync
        run: |
          echo "=== 1. TAHAP SYNC SOURCE ORANGEFOX ===" > ~/sync_output.log
          {
            mkdir -p ~/orangefox_sync && cd ~/orangefox_sync
            git config --global user.name "M0z41D"
            git config --global user.email "m0z41d@example.com"
            git clone https://gitlab.com/OrangeFox/sync.git .
            
            # Buat file stub patch agar skrip sync tidak error
            touch ~/orangefox_sync/patch-vendor-twrp-fox_12.1.diff 2>/dev/null || true
            
            ./orangefox_sync.sh --branch 12.1 --path ~/orangefox
          } >> ~/sync_output.log 2>&1

      - name: Inject Device Tree & Patch Configs
        id: inject
        run: |
          echo "=== 2. TAHAP INJECT DEVICE TREE & PATCH CONFIG ===" > ~/inject_output.log
          {
            DT_DIR=~/orangefox/device/infinix/X6855
            mkdir -p "$DT_DIR"
            
            cp -r . "$DT_DIR/"
            echo "Device tree berhasil disalin ke $DT_DIR"

            # Hapus variabel usang FOX_TARGET_DEVICES & OF_TARGET_DEVICES
            find "$DT_DIR" -type f -name "*.mk" -exec sed -i '/FOX_TARGET_DEVICES/d' {} +
            find "$DT_DIR" -type f -name "*.mk" -exec sed -i '/OF_TARGET_DEVICES/d' {} +

            # Pastikan BoardConfig.mk ada dan tambahkan parameter wajib
            BOARD_CONFIG="$DT_DIR/BoardConfig.mk"
            if [ ! -f "$BOARD_CONFIG" ]; then
              touch "$BOARD_CONFIG"
            fi
            
            grep -q "BOARD_KERNEL_IMAGE_NAME" "$BOARD_CONFIG" \vert{}\vert{} echo "BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb" >> "$BOARD_CONFIG"
            grep -q "TW_THEME" "$BOARD_CONFIG" \vert{}\vert{} echo "TW_THEME := portrait_hdpi" >> "$BOARD_CONFIG"
            grep -q "TARGET_SUPPORTS_64_BIT_APPS" "$BOARD_CONFIG" \vert{}\vert{} echo "TARGET_SUPPORTS_64_BIT_APPS := false" >> "$BOARD_CONFIG"
            grep -q "TARGET_SCREEN_WIDTH" "$BOARD_CONFIG" \vert{}\vert{} echo "TARGET_SCREEN_WIDTH := 720" >> "$BOARD_CONFIG"
            grep -q "TARGET_SCREEN_HEIGHT" "$BOARD_CONFIG" \vert{}\vert{} echo "TARGET_SCREEN_HEIGHT := 1600" >> "$BOARD_CONFIG"

            # Hapus vendorsetup.sh untuk mencegah konflik lunch
            rm -f "$DT_DIR/vendorsetup.sh"

            # Buat AndroidProducts.mk
            cat << 'EOF' > "$DT_DIR/AndroidProducts.mk"
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/fox_X6855.mk \
              $(LOCAL_DIR)/omni_X6855.mk

          COMMON_LUNCH_CHOICES := \
              fox_X6855-eng \
              fox_X6855-userdebug \
              omni_X6855-eng \
              omni_X6855-userdebug
          EOF

            # Buat fox_X6855.mk jika belum ada
            if [ ! -f "$DT_DIR/fox_X6855.mk" ]; then
              cat << 'EOF' > "$DT_DIR/fox_X6855.mk"
          $(call inherit-product,$(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          PRODUCT_NAME := fox_X6855
          PRODUCT_DEVICE := X6855
          PRODUCT_MANUFACTURER := infinix
          EOF
            fi

            # Buat omni_X6855.mk jika belum ada
            if [ ! -f "$DT_DIR/omni_X6855.mk" ]; then
              cat << 'EOF' > "$DT_DIR/omni_X6855.mk"
          $(call inherit-product,$(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          PRODUCT_NAME := omni_X6855
          PRODUCT_DEVICE := X6855
          PRODUCT_MANUFACTURER := infinix
          EOF
            fi

            echo "Struktur direktori device tree terinjeksi:"
            ls -la "$DT_DIR"
            echo "Konfigurasi device tree berhasil dipatch sepenuhnya."
          } >> ~/inject_output.log 2>&1

      - name: Compile Recovery
        id: compile
        run: |
          set +e
          echo "=== 3. TAHAP KOMPILASI RECOVERY ===" > ~/compile_output.log
          {
            cd ~/orangefox || { echo "GAGAL: Direktori ~/orangefox tidak ditemukan!"; exit 1; }
            
            # Hapus pemicu error FOX_TARGET_DEVICES dari source tree recovery
            find ~/orangefox/bootable/recovery -type f -name "*.mk" -exec sed -i '/FOX_TARGET_DEVICES/d' {} + 2>/dev/null || true

            export ALLOW_MISSING_DEPENDENCIES=true
            export FOX_BUILD_DEVICE="X6855"
            export LC_ALL="C"
            
            echo "-> Menjalankan envsetup.sh..."
            source build/envsetup.sh
            echo "Status exit envsetup: $?"

            echo "-> Menjalankan perintah lunch..."
            lunch fox_X6855-eng || lunch fox_X6855-userdebug || lunch omni_X6855-eng || lunch omni_X6855-userdebug
            echo "Status exit lunch: $?"

            echo "-> Memulai proses kompilasi mka..."
            mka vendorbootimage -j4 || mka recoveryimage -j4
            echo "Status exit mka: $?"
            
            echo "-> Memeriksa hasil file output build..."
            OUT_DIR="/home/runner/orangefox/out/target/product/X6855"
            
            if [ -f "$OUT_DIR/recovery.img" ] || [ -f "$OUT_DIR/vendor_boot.img" ] \vert{}\vert{} ls $OUT_DIR/OrangeFox-*.zip 1> /dev/null 2>&1; then
              echo "SUKSES: File image OrangeFox ditemukan!"
              exit 0
            else
              echo "GAGAL TOTAL: File recovery.img / vendor_boot.img / .zip tidak ditemukan!"
              exit 1
            fi
          } >> ~/compile_output.log 2>&1

      - name: Generate Detailed Full Report
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SPACE_OUTCOME: ${{ steps.space.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          REPO_OUTCOME: ${{ steps.repo_tool.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          INJECT_OUTCOME: ${{ steps.inject.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          REPORT_FILE=~/report_${RUN_NUM}.txt
          BUILD_TIME="$(date)"
          
          get_icon() {
            if [ "$1" = "success" ]; then
              echo "✅ Sukses"
            elif [ "$1" = "skipped" ]; then
              echo "⚠️ Dilewati"
            else
              echo "❌ Gagal"
            fi
          }

          ICON_CHECKOUT=$(get_icon "$CHECKOUT_OUTCOME")
          ICON_SPACE=$(get_icon "$SPACE_OUTCOME")
          ICON_DEPS=$(get_icon "$DEPS_OUTCOME")
          ICON_REPO=$(get_icon "$REPO_OUTCOME")
          ICON_SYNC=$(get_icon "$SYNC_OUTCOME")
          ICON_INJECT=$(get_icon "$INJECT_OUTCOME")
          ICON_COMPILE=$(get_icon "$COMPILE_OUTCOME")

          # ---------------------------------------------------------
          # 1. BUAT FILE REPORT TXT UTUH (UNTUK ARTIFACT)
          # ---------------------------------------------------------
          cat << EOF > $REPORT_FILE
          ================================================================================
                                  ORANGEFOX BUILD FULL DETAILED REPORT
          ================================================================================
          Waktu Eksekusi : $BUILD_TIME
          Target Device  : Infinix X6855
          Build Number   : #$RUN_NUM
          Runner OS      : $(lsb_release -ds 2>/dev/null || echo "Ubuntu")
          CPU Cores      : $(nproc) Cores
          --------------------------------------------------------------------------------
          
          [ I. RINGKASAN STATUS TAHAPAN WORKFLOW ]
          - Checkout Code       : $ICON_CHECKOUT
          - Maximize Build Space: $ICON_SPACE
          - Install Dependencies: $ICON_DEPS
          - Install Repo Tool   : $ICON_REPO
          - Sync Source         : $ICON_SYNC
          - Inject Device Tree  : $ICON_INJECT
          - Compile Recovery    : $ICON_COMPILE
          
          --------------------------------------------------------------------------------
          [ II. INFORMASI SUMBER DAYA SISTEM (DISK & RAM) ]
          --- Kapasitas Disk (DF) ---
          $(df -h)

          --- Status Memori & Swap (FREE) ---
          $(free -h)

          --------------------------------------------------------------------------------
          [ III. RANGKUMAN TANGKAPAN ERROR & PERINGATAN ]
          EOF

          ERRORS_FOUND=$(grep -iE "error:|missing|FAILED|fatal:|ninja: build stopped|obsolete|\*\*\*" ~/compile_output.log ~/inject_output.log ~/sync_output.log ~/deps_output.log 2>/dev/null || true)
          if [ -n "$ERRORS_FOUND" ]; then
            echo "$ERRORS_FOUND" >> $REPORT_FILE
          else
            echo "Tidak ditemukan pesan error spesifik dalam log." >> $REPORT_FILE
          fi

          cat << 'EOF' >> $REPORT_FILE

          ================================================================================
          [ IV. LOG EKSEKUSI LENGKAP SECARA KESELURUHAN (FULLY UNABRIDGED LOGS) ]
          ================================================================================

          ========================================
          1. LOG MAXIMIZE SPACE
          ========================================
          EOF
          cat ~/space_output.log >> $REPORT_FILE 2>/dev/null || echo "Log space kosong." >> $REPORT_FILE

          cat << 'EOF' >> $REPORT_FILE

          ========================================
          2. LOG INSTALL DEPENDENCIES
          ========================================
          EOF
          cat ~/deps_output.log >> $REPORT_FILE 2>/dev/null || echo "Log deps kosong." >> $REPORT_FILE

          cat << 'EOF' >> $REPORT_FILE

          ========================================
          3. LOG INSTALL REPO TOOL
          ========================================
          EOF
          cat ~/repo_output.log >> $REPORT_FILE 2>/dev/null || echo "Log repo tool kosong." >> $REPORT_FILE

          cat << 'EOF' >> $REPORT_FILE

          ========================================
          4. LOG SYNC SOURCE
          ========================================
          EOF
          cat ~/sync_output.log >> $REPORT_FILE 2>/dev/null || echo "Log sync kosong." >> $REPORT_FILE

          cat << 'EOF' >> $REPORT_FILE

          ========================================
          5. LOG INJECT DEVICE TREE
          ========================================
          EOF
          cat ~/inject_output.log >> $REPORT_FILE 2>/dev/null || echo "Log inject kosong." >> $REPORT_FILE

          cat << 'EOF' >> $REPORT_FILE

          ========================================
          6. LOG KOMPILASI (COMPILE BUILD)
          ========================================
          EOF
          cat ~/compile_output.log >> $REPORT_FILE 2>/dev/null || echo "Log compile kosong." >> $REPORT_FILE

          echo "" >> $REPORT_FILE
          echo "================================================================================" >> $REPORT_FILE
          echo "AKHIR DARI LAPORAN UTUH AUTOMATED REPORT" >> $REPORT_FILE

          # ---------------------------------------------------------
          # 2. TAMPILKAN LAPORAN PADA HALAMAN SUMMARY GITHUB ACTIONS
          # ---------------------------------------------------------
          cat << EOF > summary.md
          # 🦊 OrangeFox Recovery Build Full Report (#$RUN_NUM)

          ### 📊 Ringkasan Status Tahapan
          | Tahapan Build | Status | Detail |
          | :--- | :---: | :--- |
          | 🛠️ Checkout Code | $ICON_CHECKOUT | Ambil kode repositori |
          | 🧹 Maximize Build Space | $ICON_SPACE | Bersihkan disk runner & swap |
          | 📦 Install Dependencies | $ICON_DEPS | Pasang paket kompilasi |
          | 🛠️ Install Repo Tool | $ICON_REPO | Unduh Google Repo CLI |
          | 🔄 Sync Source | $ICON_SYNC | Pull manifes OrangeFox 12.1 |
          | 📁 Inject Device Tree | $ICON_INJECT | Konfigurasi Infinix X6855 |
          | ⚙️ Compile Recovery | $ICON_COMPILE | Kompilasi image recovery |

          ---

          ### 💾 Sumber Daya Sistem
          \`\`\`text
          $(df -h | head -n 6)
          \`\`\`
          \`\`\`text
          $(free -h)
          \`\`\`

          ---

          ### 🚨 Analisis Error Terdeteksi
          \`\`\`text
          $(grep -iE "error:|missing|FAILED|fatal:|ninja: build stopped|obsolete|\*\*\*" ~/compile_output.log ~/inject_output.log ~/sync_output.log ~/deps_output.log 2>/dev/null | tail -n 30 || echo "Tidak ada error spesifik terdeteksi.")
          \`\`\`

          ---

          ### 📜 Log Eksekusi Lengkap (Klik Dropdown)

          <details>
          <summary>🔍 1. Log Sync Source</summary>

          \`\`\`text
          $(cat ~/sync_output.log 2>/dev/null || echo "Log sync kosong.")
          \`\`\`

          </details>

          <details>
          <summary>🔍 2. Log Inject Device Tree</summary>

          \`\`\`text
          $(cat ~/inject_output.log 2>/dev/null || echo "Log inject kosong.")
          \`\`\`

          </details>

          <details>
          <summary>🔍 3. Log Compile Recovery</summary>

          \`\`\`text
          $(cat ~/compile_output.log 2>/dev/null || echo "Log compile kosong.")
          \`\`\`

          </details>

          <details>
          <summary>🔍 4. Log Install Dependencies & Setup</summary>

          \`\`\`text
          $(cat ~/deps_output.log 2>/dev/null || echo "Log deps kosong.")
          \`\`\`

          </details>

          EOF

          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Report-${{ github.run_number }}
          path: |
            /home/runner/report_${{ github.run_number }}.txt
            /home/runner/orangefox/out/target/product/X6855/vendor_boot.img
            /home/runner/orangefox/out/target/product/X6855/recovery.img
            /home/runner/orangefox/out/target/product/X6855/OrangeFox-*.zip
          if-no-files-found: ignore
