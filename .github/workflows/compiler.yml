name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a && sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo cp ~/bin/repo /usr/local/bin/repo

      - name: Sync OrangeFox Source
        id: sync
        run: |
          echo "=== 1. TAHAP SYNC SOURCE ORANGEFOX ===" > ~/sync_output.log
          mkdir -p ~/orangefox_sync && cd ~/orangefox_sync
          git config --global user.name "M0z41D"
          git config --global user.email "m0z41d@example.com"
          git clone https://gitlab.com/OrangeFox/sync.git . >> ~/sync_output.log 2>&1
          ./orangefox_sync.sh --branch 12.1 --path ~/orangefox >> ~/sync_output.log 2>&1

      - name: Inject Device Tree & Patch Configs
        id: inject
        run: |
          echo "=== 2. TAHAP INJECT DEVICE TREE & PATCH CONFIG ===" > ~/inject_output.log
          DT_DIR=~/orangefox/device/infinix/X6855
          mkdir -p $DT_DIR >> ~/inject_output.log 2>&1
          cp -r $GITHUB_WORKSPACE/* $DT_DIR/ >> ~/inject_output.log 2>&1
          echo "Device tree berhasil disalin ke $DT_DIR" >> ~/inject_output.log

          # Auto-patch semua file .mk agar penggantian OF_TARGET_DEVICES berjalan penuh
          find $DT_DIR -type f -name "*.mk" -exec sed -i 's/OF_TARGET_DEVICES/FOX_TARGET_DEVICES/g' {} +

          # Pastikan BoardConfig.mk ada dan tambahkan parameter wajib
          BOARD_CONFIG="$DT_DIR/BoardConfig.mk"
          if [ ! -f "$BOARD_CONFIG" ]; then
            touch "$BOARD_CONFIG"
          fi
          
          grep -q "BOARD_KERNEL_IMAGE_NAME" "$BOARD_CONFIG" || echo "BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb" >> "$BOARD_CONFIG"
          grep -q "TW_THEME" "$BOARD_CONFIG" || echo "TW_THEME := portrait_hdpi" >> "$BOARD_CONFIG"
          grep -q "TARGET_SUPPORTS_64_BIT_APPS" "$BOARD_CONFIG" || echo "TARGET_SUPPORTS_64_BIT_APPS := false" >> "$BOARD_CONFIG"
          grep -q "TARGET_SCREEN_WIDTH" "$BOARD_CONFIG" || echo "TARGET_SCREEN_WIDTH := 720" >> "$BOARD_CONFIG"
          grep -q "TARGET_SCREEN_HEIGHT" "$BOARD_CONFIG" || echo "TARGET_SCREEN_HEIGHT := 1600" >> "$BOARD_CONFIG"

          # Hapus vendorsetup.sh untuk mencegah konflik lunch
          rm -f "$DT_DIR/vendorsetup.sh"

          # Buat AndroidProducts.mk agar produk terdeteksi sempurna
          cat << 'EOF' > "$DT_DIR/AndroidProducts.mk"
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/fox_X6855.mk \
              $(LOCAL_DIR)/omni_X6855.mk

          COMMON_LUNCH_CHOICES := \
              fox_X6855-eng \
              fox_X6855-userdebug \
              omni_X6855-eng \
              omni_X6855-userdebug
          EOF

          # Buat fox_X6855.mk jika belum ada
          if [ ! -f "$DT_DIR/fox_X6855.mk" ]; then
            cat << 'EOF' > "$DT_DIR/fox_X6855.mk"
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          PRODUCT_NAME := fox_X6855
          PRODUCT_DEVICE := X6855
          PRODUCT_MANUFACTURER := infinix
          EOF
          fi

          # Buat omni_X6855.mk jika belum ada
          if [ ! -f "$DT_DIR/omni_X6855.mk" ]; then
            cat << 'EOF' > "$DT_DIR/omni_X6855.mk"
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          PRODUCT_NAME := omni_X6855
          PRODUCT_DEVICE := X6855
          PRODUCT_MANUFACTURER := infinix
          EOF
          fi
          
          echo "Konfigurasi device tree berhasil dipatch sepenuhnya." >> ~/inject_output.log

      - name: Compile Recovery
        id: compile
        run: |
          set +e
          echo "=== 3. TAHAP KOMPILASI RECOVERY ===" > ~/compile_output.log
          cd ~/orangefox || { echo "GAGAL: Direktori ~/orangefox tidak ditemukan!" >> ~/compile_output.log; exit 1; }
          
          # Patch tambahan pada source OrangeFox jika ada override dari environment
          find ~/orangefox/bootable/recovery -type f -name "*.mk" -exec sed -i 's/OF_TARGET_DEVICES/FOX_TARGET_DEVICES/g' {} + 2>/dev/null || true

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="X6855"
          export LC_ALL="C"
          
          echo "-> Menjalankan envsetup.sh..." >> ~/compile_output.log
          source build/envsetup.sh >> ~/compile_output.log 2>&1
          echo "Status exit envsetup: $?" >> ~/compile_output.log

          echo "-> Menjalankan perintah lunch..." >> ~/compile_output.log
          lunch fox_X6855-eng >> ~/compile_output.log 2>&1 || lunch fox_X6855-userdebug >> ~/compile_output.log 2>&1 || lunch omni_X6855-eng >> ~/compile_output.log 2>&1 || lunch omni_X6855-userdebug >> ~/compile_output.log 2>&1
          echo "Status exit lunch: $?" >> ~/compile_output.log

          echo "-> Memulai proses kompilasi mka..." >> ~/compile_output.log
          mka vendorbootimage -j4 >> ~/compile_output.log 2>&1 || mka recoveryimage -j4 >> ~/compile_output.log 2>&1
          echo "Status exit mka: $?" >> ~/compile_output.log
          
          echo "-> Memeriksa hasil file output build..." >> ~/compile_output.log
          OUT_DIR="/home/runner/orangefox/out/target/product/X6855"
          
          if [ -f "$OUT_DIR/recovery.img" ] || [ -f "$OUT_DIR/vendor_boot.img" ] || ls $OUT_DIR/OrangeFox-*.zip 1> /dev/null 2>&1; then
            echo "SUKSES: File image OrangeFox ditemukan!" >> ~/compile_output.log
            exit 0
          else
            echo "GAGAL TOTAL: File recovery.img / vendor_boot.img / .zip tidak ditemukan!" >> ~/compile_output.log
            exit 1
          fi

      - name: Generate Detailed Report File
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          INJECT_OUTCOME: ${{ steps.inject.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          REPORT_FILE=~/report_${RUN_NUM}.txt
          BUILD_TIME="$(date)"
          
          cat << EOF > $REPORT_FILE
          ================================================================================
                                  ORANGEFOX BUILD DETAILED REPORT
          ================================================================================
          Waktu Eksekusi : $BUILD_TIME
          Target Device  : Infinix X6855
          Build Number   : #$RUN_NUM
          --------------------------------------------------------------------------------
          
          [ I. RINGKASAN STATUS TAHAPAN ]
          - Sync Source         : $SYNC_OUTCOME
          - Inject Device Tree  : $INJECT_OUTCOME
          - Compile Recovery    : $COMPILE_OUTCOME
          
          --------------------------------------------------------------------------------
          [ II. INFORMASI SUMBER DAYA SISTEM (DISK & RAM) ]
          EOF

          echo "--- Kapasitas Disk (DF) ---" >> $REPORT_FILE
          df -h >> $REPORT_FILE 2>&1
          echo "" >> $REPORT_FILE
          echo "--- Status Memori & Swap ---" >> $REPORT_FILE
          free -h >> $REPORT_FILE 2>&1

          cat << 'EOF' >> $REPORT_FILE

          --------------------------------------------------------------------------------
          [ III. ANALISIS ERROR & DETAIL KESALAHAN ]
          EOF

          if [ -f ~/compile_output.log ]; then
            grep -iE "error:|FAILED|fatal:|ninja: build stopped" ~/compile_output.log >> $REPORT_FILE || echo "Tidak ditemukan kata kunci ralat standard." >> $REPORT_FILE
          else
            echo "File log kompilasi tidak wujud." >> $REPORT_FILE
          fi

          cat << 'EOF' >> $REPORT_FILE

          --------------------------------------------------------------------------------
          [ IV. LOG EKSEKUSI LENGKAP DARI AWAL ]
          
          ========================================
          1. LOG TAHAP SYNC
          ========================================
          EOF
          cat ~/sync_output.log >> $REPORT_FILE 2>/dev/null || echo "Log sync kosong." >> $REPORT_FILE

          cat << 'EOF' >> $REPORT_FILE

          ========================================
          2. LOG TAHAP INJECT DEVICE TREE
          ========================================
          EOF
          cat ~/inject_output.log >> $REPORT_FILE 2>/dev/null || echo "Log inject kosong." >> $REPORT_FILE

          cat << 'EOF' >> $REPORT_FILE

          ========================================
          3. LOG TAHAP KOMPILASI (BUILD)
          ========================================
          EOF
          cat ~/compile_output.log >> $REPORT_FILE 2>/dev/null || echo "Log compile kosong." >> $REPORT_FILE

          echo "" >> $REPORT_FILE
          echo "================================================================================" >> $REPORT_FILE
          echo "AKHIR DARI LAPORAN OTOMATIS" >> $REPORT_FILE

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Report-${{ github.run_number }}
          path: |
            /home/runner/report_${{ github.run_number }}.txt
            /home/runner/orangefox/out/target/product/X6855/vendor_boot.img
            /home/runner/orangefox/out/target/product/X6855/recovery.img
            /home/runner/orangefox/out/target/product/X6855/OrangeFox-*.zip
          if-no-files-found: ignore
