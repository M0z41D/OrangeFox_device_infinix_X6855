name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo cp ~/bin/repo /usr/local/bin/repo

      - name: Initialize & Sync OrangeFox Source via GitLab with WAF Bypass
        run: |
          set -e
          
          # Bersihkan total konfigurasi git runner
          rm -rf "$GITHUB_WORKSPACE/.git"
          sudo rm -f /etc/gitconfig ~/.gitconfig
          rm -rf ~/.config/git ~/.netrc
          unset GITHUB_TOKEN GH_TOKEN
          
          git config --global user.name "M0z41D"
          git config --global user.email "m0z41d@example.com"
          git config --global credential.helper ""
          
          # Set User-Agent browser agar lolos dari Cloudflare WAF GitLab
          git config --global http.useragent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          mkdir -p ~/orangefox && cd ~/orangefox
          mkdir -p .repo
          
          echo "==> Mengkloning manifest OrangeFox dari GitLab..."
          git clone --depth=1 -b fox_12.1 https://gitlab.com/OrangeFox/Manifest.git .repo/manifests || \
          {
            echo "==> Fallback: Mengunduh arsip tarball GitLab dengan User-Agent browser..."
            mkdir -p .repo/manifests
            curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                 -sL "https://gitlab.com/OrangeFox/Manifest/-/archive/fox_12.1/Manifest-fox_12.1.tar.gz" -o manifest.tar.gz
            tar -xzf manifest.tar.gz -C .repo/manifests --strip-components=1
            rm -f manifest.tar.gz
          }
          
          # Inisialisasi repo lokal
          repo init -u .repo/manifests -b fox_12.1 --depth=1
          
          echo "==> Memulai Repo Sync..."
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j2 || \
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j1

      - name: Inject Device Tree
        run: |
          mkdir -p ~/orangefox/device/infinix/X6855
          cp -r $GITHUB_WORKSPACE/* ~/orangefox/device/infinix/X6855/

      - name: Compile OrangeFox
        run: |
          cd ~/orangefox
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="X6855"
          export LC_ALL="C"
          source build/envsetup.sh
          lunch fox_X6855-eng || lunch fox_X6855-userdebug
          mka vendorbootimage -j$(nproc) || mka recoveryimage -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Infinix-X6855
          path: |
            /home/runner/orangefox/out/target/product/X6855/vendor_boot.img
            /home/runner/orangefox/out/target/product/X6855/recovery.img
            /home/runner/orangefox/out/target/product/X6855/OrangeFox-*.zip
